services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulsedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsedesk}
      POSTGRES_USER: ${POSTGRES_USER:-pulsedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsedesk} -d ${POSTGRES_DB:-pulsedesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsedesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rag-api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    container_name: pulsedesk-rag-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsedesk}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-pulsedesk}
      USE_PGVECTOR: "true"
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openrouter}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web-saas:
    build:
      context: ./web-saas
      dockerfile: Dockerfile
    container_name: pulsedesk-web-saas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "PulseDesk AI"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-pulsedesk}
      DB_USERNAME: ${POSTGRES_USER:-pulsedesk}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      RAG_API_URL: http://rag-api:8001
      TG_BOT_WEBHOOK_URL: http://tg-bot:3001
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-pulsedesk_internal_secret_key}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_started

  tg-bot:
    build:
      context: ./tg-bot
      dockerfile: Dockerfile
    container_name: pulsedesk-tg-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-demo-store}
      RAG_API_URL: http://rag-api:8001
      SAAS_API_URL: http://web-saas:8000
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET:-pulsedesk_internal_secret_key}
    depends_on:
      - rag-api
      - web-saas

volumes:
  pgdata:
